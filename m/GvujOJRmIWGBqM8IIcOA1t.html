<style>
:root{--navy:#0b2a5b;--ink:#06142e;--blue:#2e6fdb;--mist:#e3ecfb;--paper:#f3f6fb;--line:#d5deee;--sel:#ff8a1f;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bar:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font:15px/1.4 "Be Vietnam Pro",system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#eef2f8}
body.dark{background:#0b1730}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#top{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(var(--sat) + 6px) 8px 6px 14px;display:flex;align-items:center;gap:8px}
#top .brand{flex:1;min-width:0}
#top b{display:block;font-size:12px;font-weight:700;letter-spacing:.5px;opacity:.85}
#top span{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bD{border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
/* thanh chức năng: 6 nút luôn hiện đủ, không cần vuốt */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 6px calc(var(--sab) + 6px);background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(6,20,46,.12)}
#bar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:4px 0;border:0;border-radius:12px;background:transparent;color:var(--navy);font-size:11px;font-weight:600;line-height:1.1;text-align:center}
#bar button.on{background:var(--navy);color:#fff}
#bar button:active{background:var(--mist)}
#bar button.on:active{background:var(--navy)}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 64px);z-index:4;background:rgba(6,20,46,.82);color:#fff;font-size:13px;padding:8px 14px;border-radius:14px;pointer-events:none;text-align:center;width:max-content;max-width:92vw}
#card{position:fixed;left:8px;right:8px;bottom:calc(var(--sab) + var(--bar) + 8px);z-index:6;background:#fff;border-radius:14px;border-left:6px solid var(--sel);box-shadow:0 6px 24px rgba(6,20,46,.25);padding:10px 12px 12px;max-width:560px}
#card[hidden]{display:none}
#card .hd{display:flex;align-items:flex-start;gap:8px}
#card h3{margin:0;flex:1;font-size:16px;color:var(--navy);line-height:1.25}
#card .x{border:0;background:var(--mist);color:var(--navy);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;flex:none}
#card .mat{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:6px 0 2px;font-size:14px;font-weight:600}
#card .mat i{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(6,20,46,.3);vertical-align:-3px;margin-right:5px}
#card .dim{font-size:21px;font-weight:700;margin:4px 0 0;color:var(--ink)}
#card small{color:#5b6c8a;font-size:12px}
#card .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#card .acts button{min-height:46px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;font-size:13px;line-height:1.15;padding:4px 6px}
#card .acts button.p{background:var(--navy);color:#fff}
#card .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #edf1f8;font-size:15px}
#card .row:last-of-type{border-bottom:0}
#card .row i{width:14px;height:14px;border-radius:50%;flex:none}
#card .row span{flex:1}
#card .row b{font-size:20px;color:var(--navy)}
#panel{position:fixed;z-index:8;left:0;right:0;bottom:0;height:80vh;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(6,20,46,.3);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease}
#panel.open{transform:none}
#panel header{padding:12px 14px 4px;display:flex;align-items:center;gap:10px}
#panel header h2{margin:0;font-size:17px;color:var(--navy);flex:1}
#panel header h2 small{display:block;font-size:12px;font-weight:400;color:#5b6c8a}
#xp{border:0;background:var(--mist);color:var(--navy);width:44px;height:44px;border-radius:50%;font-size:24px;line-height:1}
#tabs{display:flex;gap:6px;padding:6px 14px}
#tabs button{flex:1;min-height:42px;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;font-weight:600;font-size:13px;padding:0 4px}
#tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
#tabs button[hidden]{display:none}
.pacts{display:flex;gap:8px;padding:2px 14px 6px}
.pacts button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:600}
.pacts button.p{background:var(--navy);color:#fff}
#q{margin:0 14px 6px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:var(--paper)}
#q:focus{outline:2px solid var(--blue);border-color:var(--blue)}

ul.l[hidden]{display:none}
ul.l li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid #edf1f8;cursor:pointer;content-visibility:auto;contain-intrinsic-size:0 60px}

ul.l li .nm{flex:1;min-width:0}
ul.l li b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.l li small{color:#5b6c8a;font-size:12px}
ul.l li.off b,ul.l li.off small{opacity:.4}
ul.l li.off b{text-decoration:line-through}
ul.l li .sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(6,20,46,.3);flex:none}
.eye{flex:0 0 46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--navy);display:grid;place-items:center}
li.off .eye{background:var(--paper);color:#9aa8c2}
li.part .eye{background:var(--mist)}
.only{flex:0 0 auto;min-height:40px;padding:0 10px;border-radius:9px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;font-size:12px}
#panel footer{padding:8px 14px calc(var(--sab) + 10px);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px;color:#5b6c8a}
#panel footer input{flex:1;accent-color:var(--navy)}
#ml{position:fixed;z-index:6;transform:translate(-50%,-130%);background:var(--navy);color:#fff;border-radius:9px;padding:5px 10px;font-size:13px;pointer-events:none;text-align:center;white-space:nowrap}
#ml b{font-size:16px;display:block}
#ml[hidden]{display:none}
#load{position:fixed;inset:0;z-index:20;background:var(--navy);color:#fff;display:grid;place-items:center;text-align:center;padding:24px}
#load b{display:block;font-size:20px;margin-bottom:6px}
#load .bar{width:180px;height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin:16px auto 0;overflow:hidden}
#load .bar i{display:block;width:40%;height:100%;background:#7fb2ff;animation:s 1.1s ease-in-out infinite}
@keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#load .bar i{animation:none}#panel{transition:none}}

 #bar{left:50%;right:auto;transform:translateX(-50%);width:560px;border-radius:16px 16px 0 0}
}

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var SRC=['https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'];

function loadThree(){return new Promise(function(res,rej){var i=0;(function next(){
  if(window.THREE)return res();
  if(i>=SRC.length)return rej(new Error('Không tải được bộ hiển thị 3D. Kiểm tra kết nối mạng rồi tải lại trang.'));
  var s=document.createElement('script');s.src=SRC[i++];s.onload=function(){res()};s.onerror=next;document.head.appendChild(s);
})()})}
function getModel(){
  if(window.__MODEL__)return Promise.resolve(window.__MODEL__);
  var m=location.pathname.match(/^(.*)\/s\/([A-Za-z0-9_-]+)\/?$/);
  if(!m)return Promise.reject(new Error('Link không hợp lệ.'));
  return fetch(m[1]+'/api/shared/'+m[2]).then(function(r){
    if(!r.ok)throw new Error(r.status===404?'Link không tồn tại hoặc đã bị xoá.':'Lỗi tải dữ liệu ('+r.status+').');
    return r.json();
  });
}
function fail(e){$('#lt').textContent='Không mở được bản vẽ';$('#ls').textContent=e.message||String(e);var b=$('#load .bar');if(b)b.remove()}
Promise.all([loadThree(),getModel()]).then(function(r){start(r[1])}).catch(fail);

function b64u8(s){var b=atob(s),n=b.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=b.charCodeAt(i);return u}
function b64f32(s){return new Float32Array(b64u8(s).buffer)}
function fold(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')}
function fmt(n){return (Math.round(n*10)/10).toString().replace('.',',')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var IC=function(d){return '<svg class="i" viewBox="0 0 24 24">'+d+'</svg>'};
var EYE=IC('<path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/>');
var EYEOFF=IC('<path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/>');

// Tên nhóm: bỏ số, ký hiệu, từ chỉ vị trí cuối (trái/phải/trên/dưới...) => "Cánh trái 2" & "Cánh phải" cùng nhóm "Cánh"
var POS={trai:1,phai:1,tren:1,duoi:1,giua:1,ngoai:1,trong:1,left:1,right:1,top:1,bottom:1};
function baseName(n){
  var s=String(n).replace(/[\[\(\{][^\]\)\}]*[\]\)\}]/g,' ').replace(/[#_\-\/\\.,:;*]+/g,' ').replace(/\d+/g,' ').replace(/\s+/g,' ').trim();
  var w=s?s.split(' '):[];
  while(w.length>1&&POS[fold(w[w.length-1])])w.pop();
  while(w.length>1&&w[w.length-1].length===1)w.pop();
  s=w.join(' ');
  if(!s||/^(component|group|tam|tấm|model)$/i.test(s))return 'Chưa đặt tên';
  return s.charAt(0).toUpperCase()+s.slice(1);
}

function start(model){
  var T=THREE,cv=$('#cv');
  var renderer=new T.WebGLRenderer({canvas:cv,antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  var scene=new T.Scene(),camera=new T.PerspectiveCamera(40,1,1,1e5);
  scene.add(new T.HemisphereLight(0xffffff,0x9aa6bd,0.55));
  var dl=new T.DirectionalLight(0xffffff,0.55);scene.add(dl);scene.add(dl.target);
  var root=new T.Group();scene.add(root);

  var parts=[],meshes=[],hasTag=false;
  function mk(o){o.side=T.DoubleSide;o.flatShading=true;o.specular=0x000000;o.shininess=0;return new T.MeshPhongMaterial(o)}
  var hiMat=mk({color:0xff8a1f});
  var lineMat=new T.LineBasicMaterial({color:0x14203a,transparent:true,opacity:.9});
  (model.parts||[]).forEach(function(p){
    var g=new T.Group(),P={id:p.i,name:p.n,layer:p.t||'',dims:p.d||[0,0,0],group:g,meshes:[],edges:[],visible:true,mats:[],gname:baseName(p.n)};
    if(P.layer)hasTag=true;
    p.m.forEach(function(mm){
      var geo=new T.BufferGeometry();
      geo.setAttribute('position',new T.BufferAttribute(b64f32(mm.p),3));
      if(mm.x){var iu=b64u8(mm.x);geo.setIndex(new T.BufferAttribute(mm.b===4?new Uint32Array(iu.buffer):new Uint16Array(iu.buffer),1))}  // đỉnh dùng chung (nhẹ ~3 lần)
      var mat=mk({color:mm.c,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
      mat.userData.a=mm.a;if(mm.a<1){mat.transparent=true;mat.opacity=mm.a;mat.depthWrite=false}
      var mesh=new T.Mesh(geo,mat);mesh.userData.part=P;mesh.userData.mat=mat;
      g.add(mesh);P.meshes.push(mesh);meshes.push(mesh);
      var nm=mm.n||'Chưa gán vật liệu';
      if(!P.mats.some(function(x){return x.n===nm}))P.mats.push({n:nm,c:mm.c});
    });
    P.key=fold(p.i+' '+p.n+' '+P.gname+' '+P.layer+' '+P.mats.map(function(x){return x.n}).join(' '));
    root.add(g);parts.push(P);
  });
  if(!parts.length)return fail(new Error('Bản vẽ không có dữ liệu.'));
  $('#sub').textContent=parts.length+' tấm';

  var box=new T.Box3().setFromObject(root),center=box.getCenter(new T.Vector3()),radius=Math.max(box.getSize(new T.Vector3()).length()/2,1);

  // ---------- camera
  var ctl={target:center.clone(),theta:0.75,phi:1.15,r:radius*2.5,sens:1},need=true,ndc=new T.Vector2(),ray=new T.Raycaster();
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function applyCam(){
    var s=Math.sin(ctl.phi);
    camera.position.set(ctl.target.x+ctl.r*s*Math.sin(ctl.theta),ctl.target.y+ctl.r*Math.cos(ctl.phi),ctl.target.z+ctl.r*s*Math.cos(ctl.theta));
    camera.lookAt(ctl.target);camera.near=Math.max(ctl.r*0.01,1);camera.far=ctl.r+radius*6;camera.updateProjectionMatrix();need=true;
  }
  function fit(b,keep){
    var c=b.getCenter(new T.Vector3()),rad=Math.max(b.getSize(new T.Vector3()).length()/2,1);
    var r=rad/Math.sin(camera.fov*Math.PI/360)*1.05;if(camera.aspect<1)r/=camera.aspect;
    ctl.target.copy(c);ctl.r=r;if(!keep){ctl.theta=0.75;ctl.phi=1.15}applyCam();
  }
  function fitParts(list){
    var b=null;list.forEach(function(P){if(!P.visible)return;var x=new T.Box3().setFromObject(P.group);b=b?b.union(x):x});
    if(b)fit(b,true);
  }
  function resize(){var w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();need=true}
  window.addEventListener('resize',resize);resize();fit(box);
  function pan(dx,dy){
    var k=2*ctl.r*Math.tan(camera.fov*Math.PI/360)/window.innerHeight;camera.updateMatrixWorld();
    var rt=new T.Vector3().setFromMatrixColumn(camera.matrix,0),up=new T.Vector3().setFromMatrixColumn(camera.matrix,1);
    ctl.target.addScaledVector(rt,-dx*k).addScaledVector(up,dy*k);applyCam();
  }
  function rotate(dx,dy){ctl.theta-=dx*0.006*ctl.sens;ctl.phi=clamp(ctl.phi-dy*0.006*ctl.sens,0.05,Math.PI-0.05);applyCam()}
  function zoom(f){ctl.r=clamp(ctl.r*f,radius*0.02,radius*12);applyCam()}

  var ptrs=new Map(),down=null;
  cv.addEventListener('pointerdown',function(e){
    cv.setPointerCapture(e.pointerId);
    if(ptrs.size>0&&down)down.multi=true;else down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,btn:e.button,multi:false};
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  });
  cv.addEventListener('pointermove',function(e){
    var p=ptrs.get(e.pointerId);if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(ptrs.size===1){
      down.moved+=Math.abs(dx)+Math.abs(dy);p.x=e.clientX;p.y=e.clientY;
      if((e.buttons&6)||e.shiftKey)pan(dx,dy);else rotate(dx,dy);
    }else if(ptrs.size===2){
      var o=null;ptrs.forEach(function(v,id){if(id!==e.pointerId)o=v});
      var d0=Math.hypot(p.x-o.x,p.y-o.y),cx0=(p.x+o.x)/2,cy0=(p.y+o.y)/2;
      p.x=e.clientX;p.y=e.clientY;
      var d1=Math.hypot(p.x-o.x,p.y-o.y);
      pan((p.x+o.x)/2-cx0,(p.y+o.y)/2-cy0);if(d1>0&&d0>0)zoom(d0/d1);
    }
  });
  function up(e){
    if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
    if(ptrs.size===0&&down){
      if(e.type==='pointerup'&&!down.multi&&down.moved<8&&performance.now()-down.t<600&&down.btn===0)tap(e.clientX,e.clientY);
      down=null;
    }
  }
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',function(e){e.preventDefault();zoom(Math.exp(e.deltaY*0.0012))},{passive:false});
  cv.addEventListener('contextmenu',function(e){e.preventDefault()});

  // ---------- chọn / ẩn / xuyên thấu
  var sel=null,xray=false,mode='select',byId={};parts.forEach(function(P){byId[P.id]=P});
  function pickable(){var o=[];parts.forEach(function(P){if(P.visible)P.meshes.forEach(function(m){o.push(m)})});return o}
  function hit(cx,cy){
    var r=cv.getBoundingClientRect();ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera);return ray.intersectObjects(pickable(),false)[0]||null;
  }
  function refresh(){
    meshes.forEach(function(m){
      var P=m.userData.part,b=m.userData.mat,isSel=P===sel,faded=xray&&!isSel;
      m.material=isSel?hiMat:b;
      b.transparent=faded||b.userData.a<1;b.opacity=faded?0.12:b.userData.a;b.depthWrite=!b.transparent;
    });
    parts.forEach(function(P){P.group.visible=P.visible;var show=!(xray&&P!==sel);P.edges.forEach(function(l){l.visible=show})});need=true;
  }
  function visChanged(){
    if(sel&&!sel.visible)sel=null;
    refresh();showCard();syncAll();
  }
  function setVis(list,v){list.forEach(function(P){P.visible=v});visChanged()}
  function only(list){var s={};list.forEach(function(P){s[P.id]=1});parts.forEach(function(P){P.visible=!!s[P.id]});visChanged();fitParts(list)}

  // ---------- thẻ thông tin
  var card=$('#card');
  function showCard(){
    if(mode!=='select'||!sel){if(mode==='select')card.hidden=true;return}
    var d=sel.dims,sw=sel.mats.map(function(x){return '<span><i style="background:'+esc(x.c)+'"></i>'+esc(x.n)+'</span>'}).join('');
    card.innerHTML='<div class="hd"><h3>#'+sel.id+' · '+esc(sel.name)+'</h3><button class="x" id="cX" type="button" aria-label="Bỏ chọn">×</button></div>'+
      '<div class="mat">'+sw+'</div>'+
      '<div class="dim">'+fmt(d[0])+' × '+fmt(d[1])+' × '+fmt(d[2])+' mm</div>'+
      '<small>Dài × Rộng × Dày'+(sel.layer?' · Tag: '+esc(sel.layer):'')+'</small>'+
      '<div class="acts"><button id="aH" type="button">Ẩn tấm này</button>'+
      '<button id="aG" type="button">Ẩn cả nhóm «'+esc(sel.gname)+'»</button>'+
      '<button id="aI" class="p" type="button">Chỉ xem tấm này</button>'+
      '<button id="aA" type="button">Chỉ xem nhóm «'+esc(sel.gname)+'»</button></div>';
    card.hidden=false;
    $('#cX').onclick=function(){select(null)};
    $('#aH').onclick=function(){setVis([sel],false)};
    $('#aG').onclick=function(){setVis(parts.filter(function(P){return P.gname===sel.gname}),false)};
    $('#aI').onclick=function(){var s=sel;only([s])};
    $('#aA').onclick=function(){only(parts.filter(function(P){return P.gname===sel.gname}))};
  }
  function select(P,focus){
    sel=P;refresh();showCard();syncAll(true);
    try{history.replaceState(null,'',P?'#'+P.id:location.pathname+location.search)}catch(e){}
    if(P&&focus)fit(new T.Box3().setFromObject(P.group),true);
  }

  // ---------- đo 2 điểm + đo lọt lòng
  var mpts=[],mgroup=new T.Group(),ml=$('#ml');scene.add(mgroup);
  function snap(h,cx,cy){
    var g=h.object.geometry.attributes.position,best=h.point.clone(),bd=30,r=cv.getBoundingClientRect(),f=h.face;
    [f.a,f.b,f.c].forEach(function(i){
      var v=new T.Vector3(g.getX(i),g.getY(i),g.getZ(i)).applyMatrix4(h.object.matrixWorld),s=v.clone().project(camera);
      var sx=(s.x+1)/2*r.width+r.left,sy=(1-s.y)/2*r.height+r.top,d=Math.hypot(sx-cx,sy-cy);
      if(d<bd){bd=d;best=v}
    });return best;
  }
  var marks=[],segs=[],YAX=new T.Vector3(0,1,0);
  function clearMeasure(){mpts=[];marks=[];segs=[];while(mgroup.children.length)mgroup.remove(mgroup.children[0]);ml.hidden=true;need=true}
  function dot(p,col){var m=new T.Mesh(new T.SphereGeometry(1,14,10),new T.MeshBasicMaterial({color:col,depthTest:false}));m.position.copy(p);m.renderOrder=10;mgroup.add(m);marks.push(m)}
  function seg(a,b,col){var m=new T.Mesh(new T.CylinderGeometry(1,1,1,8),new T.MeshBasicMaterial({color:col,depthTest:false}));m.renderOrder=9;mgroup.add(m);segs.push({m:m,a:a.clone(),b:b.clone()})}
  // đổi kích thước theo khoảng cách camera để luôn cỡ cố định trên màn hình (chấm ~5px, nét ~1.5px)
  function pxScale(p,px){return camera.position.distanceTo(p)*2*Math.tan(camera.fov*Math.PI/360)/window.innerHeight*px}
  function updateMarks(){
    marks.forEach(function(m){m.scale.setScalar(pxScale(m.position,5))});
    segs.forEach(function(g){
      var d=g.b.clone().sub(g.a),len=d.length(),mid=g.a.clone().add(g.b).multiplyScalar(0.5),w=pxScale(mid,1.6);
      g.m.position.copy(mid);g.m.quaternion.setFromUnitVectors(YAX,d.normalize());g.m.scale.set(w,len,w);
    });
  }
  function measureTap(cx,cy){
    var h=hit(cx,cy);if(!h)return;if(mpts.length>=2)clearMeasure();
    var p=snap(h,cx,cy);mpts.push(p);dot(p,0xff8a1f);
    if(mpts.length===2){
      seg(mpts[0],mpts[1],0xff8a1f);
      var a=mpts[0],b=mpts[1];
      ml.innerHTML='<b>'+fmt(a.distanceTo(b))+' mm</b>X '+fmt(Math.abs(a.x-b.x))+' · Y '+fmt(Math.abs(a.z-b.z))+' · Z '+fmt(Math.abs(a.y-b.y));ml.hidden=false;
      hint('Chạm điểm bất kỳ để đo lại');
    }else hint('Chạm điểm thứ 2 (tự bắt vào góc tấm)');
    need=true;
  }
  // Lọt lòng: từ điểm chạm bắn tia theo 3 trục, 2 chiều; khoảng hở = tổng 2 chiều tới mặt ván gần nhất
  var AXN=[{n:'Theo trục X',c:0x2e6fdb},{n:'Chiều cao (Z)',c:0xff8a1f},{n:'Theo trục Y',c:0x16a34a}];
  function cast(o,d,objs){ray.set(o,d);ray.near=0;ray.far=1e7;return ray.intersectObjects(objs,false)[0]||null}
  function innerTap(cx,cy){
    var h=hit(cx,cy);if(!h)return;clearMeasure();
    var n=h.face.normal.clone(),toCam=camera.position.clone().sub(h.point);if(n.dot(toCam)<0)n.negate();
    var o=h.point.clone().addScaledVector(n,2),objs=pickable(),res=[];
    [[1,0,0],[0,1,0],[0,0,1]].forEach(function(d,i){
      var dv=new T.Vector3(d[0],d[1],d[2]),a=cast(o,dv,objs),b=cast(o,dv.clone().negate(),objs);
      if(a&&b)res.push({i:i,len:a.distance+b.distance,a:a.point.clone(),b:b.point.clone()});
    });
    res.sort(function(x,y){return (x.i===1?-1:x.i)-(y.i===1?-1:y.i)});
    var html='<div class="hd"><h3>Lọt lòng tại điểm chạm</h3><button class="x" id="cX" type="button" aria-label="Đóng">×</button></div>';
    if(!res.length)html+='<p style="margin:8px 0 0">Không đo được: điểm chạm không nằm trong khoang có ván hai phía. Hãy chạm vào <b>mặt trong</b> của một tấm (ẩn cánh/hậu nếu đang che khoang).</p>';
    res.forEach(function(r){
      var ax=AXN[r.i];seg(r.a,r.b,ax.c);dot(r.a,ax.c);dot(r.b,ax.c);
      html+='<div class="row"><i style="background:#'+('000000'+ax.c.toString(16)).slice(-6)+'"></i><span>'+ax.n+'</span><b>'+fmt(r.len)+' mm</b></div>';
    });
    html+='<small>Khoảng hở giữa các mặt ván gần nhất. Chạm mặt trong khác để đo tiếp.</small>';
    card.innerHTML=html;card.hidden=false;$('#cX').onclick=function(){setMode('select')};need=true;
  }
  function tap(cx,cy){
    if(mode==='measure')return measureTap(cx,cy);
    if(mode==='inner')return innerTap(cx,cy);
    var h=hit(cx,cy);select(h?h.object.userData.part:null,false);
  }
  function setMode(m){
    mode=(mode===m)?'select':m;clearMeasure();
    $('#bM').classList.toggle('on',mode==='measure');$('#bI').classList.toggle('on',mode==='inner');
    if(mode==='select'){card.hidden=true;showCard();hint('')}
    else{card.hidden=true;closePanel();hint(mode==='measure'?'Chạm điểm thứ 1 (tự bắt vào góc tấm)':'Chạm vào MẶT TRONG của ván để đo lọt lòng (ẩn cánh/hậu nếu đang che)')}
  }

  // ---------- panel: nhóm theo tên / vật liệu / tag + từng tấm
  var panel=$('#panel'),tab='name',glist=$('#glist'),list=$('#list'),rows={},groups={name:null,mat:null,tag:null};
  function mkGroups(kind){
    var map={},arr=[];
    parts.forEach(function(P){
      var keys=kind==='name'?[P.gname]:kind==='mat'?P.mats.map(function(x){return x.n}):[P.layer||'(Không gắn tag)'];
      keys.forEach(function(k){
        var g=map[k];if(!g){g=map[k]={label:k,key:fold(k),parts:[],color:null};arr.push(g)}
        g.parts.push(P);
        if(kind==='mat'&&!g.color)P.mats.forEach(function(x){if(x.n===k)g.color=x.c});
      });
    });
    arr.sort(function(a,b){return a.label.localeCompare(b.label,'vi')});
    return arr;
  }
  function renderGroups(kind){
    if(!groups[kind])groups[kind]=mkGroups(kind);
    glist.innerHTML='';
    groups[kind].forEach(function(g){
      var li=document.createElement('li');
      li.innerHTML='<button class="eye" type="button" aria-label="Ẩn / hiện nhóm"></button>'+(g.color?'<span class="sw" style="background:'+esc(g.color)+'"></span>':'')+
        '<div class="nm"><b>'+esc(g.label)+'</b><small></small></div><button class="only" type="button">Chỉ xem</button>';
      li.onclick=function(){var vis=g.parts.every(function(P){return P.visible});setVis(g.parts,!vis)};
      li.querySelector('.only').onclick=function(ev){ev.stopPropagation();only(g.parts)};
      g.li=li;glist.appendChild(li);
    });
    updateGroupRows();applyFilter();
  }
  function updateGroupRows(){
    if(tab==='list'||!groups[tab])return;
    groups[tab].forEach(function(g){
      var n=g.parts.length,v=g.parts.filter(function(P){return P.visible}).length;
      g.li.classList.toggle('off',v===0);g.li.classList.toggle('part',v>0&&v<n);
      g.li.querySelector('.eye').innerHTML=v===0?EYEOFF:EYE;
      g.li.querySelector('small').textContent=n+' tấm'+(v>0&&v<n?' · đang hiện '+v:v===0?' · đang ẩn':'');
    });
  }
  parts.forEach(function(P){
    var li=document.createElement('li');
    li.innerHTML='<button class="eye" type="button" aria-label="Ẩn / hiện"></button><span class="sw" style="background:'+esc(P.mats[0].c)+'"></span><div class="nm"><b>#'+P.id+' · '+esc(P.name)+'</b><small>'+esc(P.mats.map(function(x){return x.n}).join(', '))+' · '+fmt(P.dims[0])+' × '+fmt(P.dims[1])+' × '+fmt(P.dims[2])+'</small></div>';
    li.querySelector('.eye').onclick=function(ev){ev.stopPropagation();setVis([P],!P.visible)};
    li.onclick=function(){select(P,true);if(window.innerWidth<860)closePanel()};
    list.appendChild(li);rows[P.id]=li;
  });
  function syncList(scroll){
    parts.forEach(function(P){var li=rows[P.id];li.classList.toggle('sel',P===sel);li.classList.toggle('off',!P.visible);li.querySelector('.eye').innerHTML=P.visible?EYE:EYEOFF});
    if(scroll&&sel&&tab==='list'&&rows[sel.id])rows[sel.id].scrollIntoView({block:'nearest'});
  }
  function syncAll(scroll){syncList(scroll);updateGroupRows()}
  function applyFilter(){
    var q=fold($('#q').value.trim());
    if(tab==='list')parts.forEach(function(P){rows[P.id].style.display=(!q||P.key.indexOf(q)>=0)?'':'none'});
    else if(groups[tab])groups[tab].forEach(function(g){g.li.style.display=(!q||g.key.indexOf(q)>=0)?'':'none'});
  }
  function setTab(t){
    tab=t;
    document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});
    glist.hidden=t==='list';list.hidden=t!=='list';
    $('#pt').firstChild.nodeValue=t==='list'?'Chọn từng tấm':'Ẩn / hiện hàng loạt';
    if(t==='list'){syncList(true)}else renderGroups(t);
    applyFilter();
  }
  document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){setTab(b.getAttribute('data-t'))}});
  if(!hasTag)$('#tabs button[data-t="tag"]').hidden=true;
  $('#q').addEventListener('input',applyFilter);
  $('#q').addEventListener('keydown',function(e){
    if(e.key!=='Enter'||tab!=='list')return;var q=this.value.trim();
    var P=byId[q]||parts.filter(function(x){return rows[x.id].style.display!=='none'})[0];
    if(P){select(P,true);if(window.innerWidth<860)closePanel()}
  });
  function openPanel(t){if(mode!=='select')setMode(mode);setTab(t);panel.classList.add('open');document.body.classList.add('po')}
  function closePanel(){panel.classList.remove('open');document.body.classList.remove('po')}
  $('#bG').onclick=function(){panel.classList.contains('open')&&tab!=='list'?closePanel():openPanel('name')};
  $('#bL').onclick=function(){panel.classList.contains('open')&&tab==='list'?closePanel():openPanel('list')};
  $('#xp').onclick=closePanel;
  $('#pShow').onclick=function(){setVis(parts,true)};
  $('#pHide').onclick=function(){setVis(parts,false)};
  $('#sens').oninput=function(){ctl.sens=this.value/100;$('#sv').textContent=this.value+'%'};

  // ---------- thanh chức năng
  var hintEl=$('#hint'),hintT=0;
  function hint(t){clearTimeout(hintT);if(!t){hintEl.style.display='none';return}hintEl.textContent=t;hintEl.style.display='';hintT=setTimeout(function(){hintEl.style.display='none'},6000)}
  $('#bX').onclick=function(){xray=!xray;this.classList.toggle('on',xray);refresh()};
  $('#bM').onclick=function(){closePanel();setMode('measure')};
  $('#bI').onclick=function(){closePanel();setMode('inner')};
  $('#bH').onclick=function(){
    closePanel();if(mode!=='select')setMode(mode);
    sel=null;parts.forEach(function(P){P.visible=true});card.hidden=true;refresh();syncAll();fit(box);
    try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  };
  $('#bD').onclick=function(){document.body.classList.toggle('dark');applyBg()};
  function applyBg(){var d=document.body.classList.contains('dark');renderer.setClearColor(d?0x0b1730:0xeef2f8,1);lineMat.color.setHex(d?0xa9c4f2:0x14203a);need=true}
  applyBg();hint('1 ngón xoay · 2 ngón di chuyển/thu phóng · chạm vào tấm để xem vật liệu & kích thước');

  // ---------- vẽ
  var proj=new T.Vector3();
  function render(){
    dl.position.copy(camera.position).add(new T.Vector3(0,ctl.r*0.35,0));dl.target.position.copy(ctl.target);
    updateMarks();renderer.render(scene,camera);
    if(!ml.hidden&&mpts.length===2){
      proj.copy(mpts[0]).add(mpts[1]).multiplyScalar(0.5).project(camera);
      ml.style.left=((proj.x+1)/2*window.innerWidth)+'px';ml.style.top=((1-proj.y)/2*window.innerHeight)+'px';
    }
  }
  (function loop(){requestAnimationFrame(loop);if(need){need=false;render()}})();
  setTab('name');refresh();syncAll();
  $('#load').style.display='none';

  // viền tấm: mặc định bật cho mọi thiết bị, dựng dần từng lát nhỏ để không đơ máy
  var qi=0;(function edgeBatch(){
    var t=performance.now();
    while(qi<meshes.length&&performance.now()-t<12){
      var m=meshes[qi++],l=new T.LineSegments(new T.EdgesGeometry(m.geometry,25),lineMat);
      l.visible=!(xray&&m.userData.part!==sel);m.userData.part.group.add(l);m.userData.part.edges.push(l);
    }
    need=true;if(qi<meshes.length)setTimeout(edgeBatch,0);
  })();

  function fromHash(){var id=parseInt((location.hash||'').slice(1),10);if(id&&byId[id])select(byId[id],true)}
  window.addEventListener('hashchange',fromHash);fromHash();
}
})();
</script>
</body>
</html>
