<title>Bản vẽ lắp đặt · TU VANG ANH TUAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2a5b;--ink:#06142e;--blue:#2e6fdb;--mist:#e3ecfb;--paper:#f3f6fb;--line:#d5deee;--sel:#ff8a1f;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bar:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font:15px/1.4 "Be Vietnam Pro",system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#eef2f8}
body.dark{background:#0b1730}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#top{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(var(--sat) + 6px) 8px 6px 14px;display:flex;align-items:center;gap:8px}
#top .brand{flex:1;min-width:0}
#top b{display:block;font-size:12px;font-weight:700;letter-spacing:.5px;opacity:.85}
#top span{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bD{border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
/* thanh chức năng: 6 nút luôn hiện đủ, không cần vuốt */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 6px calc(var(--sab) + 6px);background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(6,20,46,.12)}
#bar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:4px 0;border:0;border-radius:12px;background:transparent;color:var(--navy);font-size:11px;font-weight:600;line-height:1.1;text-align:center}
#bar button.on{background:var(--navy);color:#fff}
#bar button:active{background:var(--mist)}
#bar button.on:active{background:var(--navy)}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--sat) + 64px);z-index:4;background:rgba(6,20,46,.82);color:#fff;font-size:13px;padding:8px 14px;border-radius:14px;pointer-events:none;text-align:center;width:max-content;max-width:92vw}
#card{position:fixed;left:8px;right:8px;bottom:calc(var(--sab) + var(--bar) + 8px);z-index:6;background:#fff;border-radius:14px;border-left:6px solid var(--sel);box-shadow:0 6px 24px rgba(6,20,46,.25);padding:10px 12px 12px;max-width:560px}
#card[hidden]{display:none}
#card .hd{display:flex;align-items:flex-start;gap:8px}
#card h3{margin:0;flex:1;font-size:16px;color:var(--navy);line-height:1.25}
#card .x{border:0;background:var(--mist);color:var(--navy);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;flex:none}
#card .mat{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:6px 0 2px;font-size:14px;font-weight:600}
#card .mat i{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(6,20,46,.3);vertical-align:-3px;margin-right:5px}
#card .dim{font-size:21px;font-weight:700;margin:4px 0 0;color:var(--ink)}
#card small{color:#5b6c8a;font-size:12px}
#card .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
#card .acts button{min-height:46px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;font-size:13px;line-height:1.15;padding:4px 6px}
#card .acts button.p{background:var(--navy);color:#fff}
#card .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #edf1f8;font-size:15px}
#card .row:last-of-type{border-bottom:0}
#card .row i{width:14px;height:14px;border-radius:50%;flex:none}
#card .row span{flex:1}
#card .row b{font-size:20px;color:var(--navy)}
#panel{position:fixed;z-index:8;left:0;right:0;bottom:0;height:80vh;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(6,20,46,.3);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s ease}
#panel.open{transform:none}
#panel header{padding:12px 14px 4px;display:flex;align-items:center;gap:10px}
#panel header h2{margin:0;font-size:17px;color:var(--navy);flex:1}
#panel header h2 small{display:block;font-size:12px;font-weight:400;color:#5b6c8a}
#xp{border:0;background:var(--mist);color:var(--navy);width:44px;height:44px;border-radius:50%;font-size:24px;line-height:1}
#tabs{display:flex;gap:6px;padding:6px 14px}
#tabs button{flex:1;min-height:42px;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;font-weight:600;font-size:13px;padding:0 4px}
#tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
#tabs button[hidden]{display:none}
.pacts{display:flex;gap:8px;padding:2px 14px 6px}
.pacts button{flex:1;min-height:44px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:600}
.pacts button.p{background:var(--navy);color:#fff}
#q{margin:0 14px 6px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:var(--paper)}
#q:focus{outline:2px solid var(--blue);border-color:var(--blue)}
ul.l{list-style:none;margin:0;padding:0 8px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
ul.l[hidden]{display:none}
ul.l li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid #edf1f8;cursor:pointer;content-visibility:auto;contain-intrinsic-size:0 60px}
ul.l li.sel{background:#fff1e0;box-shadow:inset 4px 0 0 var(--sel)}
ul.l li .nm{flex:1;min-width:0}
ul.l li b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.l li small{color:#5b6c8a;font-size:12px}
ul.l li.off b,ul.l li.off small{opacity:.4}
ul.l li.off b{text-decoration:line-through}
ul.l li .sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(6,20,46,.3);flex:none}
.eye{flex:0 0 46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--navy);display:grid;place-items:center}
li.off .eye{background:var(--paper);color:#9aa8c2}
li.part .eye{background:var(--mist)}
.only{flex:0 0 auto;min-height:40px;padding:0 10px;border-radius:9px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;font-size:12px}
#panel footer{padding:8px 14px calc(var(--sab) + 10px);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px;color:#5b6c8a}
#panel footer input{flex:1;accent-color:var(--navy)}
#ml{position:fixed;z-index:6;transform:translate(-50%,-130%);background:var(--navy);color:#fff;border-radius:9px;padding:5px 10px;font-size:13px;pointer-events:none;text-align:center;white-space:nowrap}
#ml b{font-size:16px;display:block}
#ml[hidden]{display:none}
#load{position:fixed;inset:0;z-index:20;background:var(--navy);color:#fff;display:grid;place-items:center;text-align:center;padding:24px}
#load b{display:block;font-size:20px;margin-bottom:6px}
#load .bar{width:180px;height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin:16px auto 0;overflow:hidden}
#load .bar i{display:block;width:40%;height:100%;background:#7fb2ff;animation:s 1.1s ease-in-out infinite}
@keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#load .bar i{animation:none}#panel{transition:none}}
@media (max-width:340px){#bar button{font-size:10px}}
@media (min-width:860px){
 #panel{left:auto;top:calc(var(--sat) + 58px);bottom:var(--bar);height:auto;width:380px;border-radius:0;transform:translateX(105%)}
 #card{left:16px;right:auto;width:440px}
 #bar{left:50%;right:auto;transform:translateX(-50%);width:560px;border-radius:16px 16px 0 0}
}
</style>
</head>

  function pan(dx,dy){

  var ptrs=new Map(),down=null;
  cv.addEventListener('pointerdown',function(e){

  // ---------- chọn / ẩn / xuyên thấu
  var sel=null,xray=false,mode='select',byId={};parts.forEach(function(P){byId[P.id]=P});

  }
  function refresh(){

  // ---------- thẻ thông tin

  // ---------- đo 2 điểm + đo lọt lòng
  var mpts=[],mgroup=new T.Group(),ml=$('#ml');scene.add(mgroup);
  function snap(h,cx,cy){
    var g=h.object.geometry.attributes.position,best=h.point.clone(),bd=30,r=cv.getBoundingClientRect(),f=h.face;
    [f.a,f.b,f.c].forEach(function(i){

  }
  var marks=[],segs=[],YAX=new T.Vector3(0,1,0);

  function dot(p,col){var m=new T.Mesh(new T.SphereGeometry(1,14,10),new T.MeshBasicMaterial({color:col,depthTest:false}));m.position.copy(p);m.renderOrder=10;mgroup.add(m);marks.push(m)}
  function seg(a,b,col){var m=new T.Mesh(new T.CylinderGeometry(1,1,1,8),new T.MeshBasicMaterial({color:col,depthTest:false}));m.renderOrder=9;mgroup.add(m);segs.push({m:m,a:a.clone(),b:b.clone()})}
  // đổi kích thước theo khoảng cách camera để luôn cỡ cố định trên màn hình (chấm ~5px, nét ~1.5px)
  function pxScale(p,px){return camera.position.distanceTo(p)*2*Math.tan(camera.fov*Math.PI/360)/window.innerHeight*px}
  function updateMarks(){
    marks.forEach(function(m){m.scale.setScalar(pxScale(m.position,5))});
    segs.forEach(function(g){

      var a=mpts[0],b=mpts[1];
      ml.innerHTML='<b>'+fmt(a.distanceTo(b))+' mm</b>X '+fmt(Math.abs(a.x-b.x))+' · Y '+fmt(Math.abs(a.z-b.z))+' · Z '+fmt(Math.abs(a.y-b.y));ml.hidden=false;

  // Lọt lòng: từ điểm chạm bắn tia theo 3 trục, 2 chiều; khoảng hở = tổng 2 chiều tới mặt ván gần nhất

  // ---------- panel: nhóm theo tên / vật liệu / tag + từng tấm
  var panel=$('#panel'),tab='name',glist=$('#glist'),list=$('#list'),rows={},groups={name:null,mat:null,tag:null};

    li.querySelector('.eye').onclick=function(ev){ev.stopPropagation();setVis([P],!P.visible)};

    list.appendChild(li);rows[P.id]=li;
  });

    parts.forEach(function(P){var li=rows[P.id];li.classList.toggle('sel',P===sel);li.classList.toggle('off',!P.visible);li.querySelector('.eye').innerHTML=P.visible?EYE:EYEOFF});

    else if(groups[tab])groups[tab].forEach(function(g){g.li.style.display=(!q||g.key.indexOf(q)>=0)?'':'none'});
  }

  }

  }
  (function loop(){requestAnimationFrame(loop);if(need){need=false;render()}})();
  setTab('name');refresh();syncAll();
  $('#load').style.display='none';

  // viền tấm: mặc định bật cho mọi thiết bị, dựng dần từng lát nhỏ để không đơ máy
  var qi=0;(function edgeBatch(){
    var t=performance.now();
    while(qi<meshes.length&&performance.now()-t<12){
      var m=meshes[qi++],l=new T.LineSegments(new T.EdgesGeometry(m.geometry,25),lineMat);
      l.visible=!(xray&&m.userData.part!==sel);m.userData.part.group.add(l);m.userData.part.edges.push(l);
    }
    need=true;if(qi<meshes.length)setTimeout(edgeBatch,0);
  })();

  function fromHash(){var id=parseInt((location.hash||'').slice(1),10);if(id&&byId[id])select(byId[id],true)}
  window.addEventListener('hashchange',fromHash);fromHash();
}
})();
</script>
